<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Item - HelpEthiopia</title>
    <link rel="icon" type="image/jpeg" href="images/download.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">Help<span>Ethiopia</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="items.html">Browse Items</a></li>
                <li><a href="donate.html" class="active">Donate</a></li>
                <li><a href="request.html">Request</a></li>
                <li><a href="map.html">Map</a></li>
            </ul>
            <div class="auth-links" style="display:flex; gap: 10px;">
                <a href="signup.html" class="btn" style="background: none; color: var(--dark); padding: 8px 15px; border: 1px solid #ccc;">Sign Up</a>
                <a href="login.html" class="btn-login">Login</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h2 style="text-align: center;">Post a Donation</h2>
        <p style="text-align: center; color: #666;">Fill in the details to connect your item with a verified recipient.</p>

        <div class="form-container">
            <form id="donationForm">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" class="form-control" placeholder="e.g. Winter Jacket" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select class="form-control" required>
                        <option value="Clothes">Clothes</option>
                        <option value="Food">Food</option>
                        <option value="Books">Books</option>
                        <option value="Hygiene">Hygiene</option>
                        <option value="Electronics">Electronics</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Condition</label>
                    <select class="form-control">
                        <option>New</option>
                        <option>Like New</option>
                        <option>Used - Good</option>
                        <option>Used - Fair</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" class="form-control" value="1" min="1">
                </div>

                <div class="form-group">
                    <label>Delivery Option</label>
                    <select class="form-control">
                        <option>I can drop it off</option>
                        <option>I need a pickup</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Upload Photo (Optional)</label>
                    <input type="file" class="form-control" id="photoUpload" accept="image/*">
                    <div id="imagePreview"></div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea class="form-control" placeholder="Describe the item, including size, expiry dates, or brand."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Donation</button>
            </form>
        </div>
    </div>
    
    <!-- Load data.js for StorageManager -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Image preview
        document.getElementById('photoUpload').addEventListener('change', function() {
            ImagePreview.showPreview(this, document.getElementById('imagePreview').querySelector('img'));
        });

        document.getElementById('donationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate form
            if (!FormValidator.validateForm(this)) {
                Notification.error('Please fill in all required fields correctly');
                return;
            }
            
            // Get form values
            const formData = {
                type: 'Donation',
                name: this.querySelector('input[type="text"]').value,
                category: this.querySelectorAll('select')[0].value,
                condition: this.querySelectorAll('select')[1].value,
                quantity: this.querySelector('input[type="number"]').value,
                deliveryOption: this.querySelectorAll('select')[2].value,
                description: this.querySelector('textarea').value,
                location: 'Addis Ababa', // Default location, can be enhanced
                urgency: 'Medium',
                image: 'https://placehold.co/300x200?text=' + encodeURIComponent(this.querySelector('input[type="text"]').value)
            };

            // Handle image upload if present
            const fileInput = this.querySelector('input[type="file"]');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    formData.image = e.target.result;
                    saveAndRedirect(formData);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveAndRedirect(formData);
            }
        });

        function saveAndRedirect(formData) {
            // Save to localStorage
            const newItem = StorageManager.addItem(formData);
            
            // Show success notification
            Notification.success('Donation posted successfully!');
            
            // Show success message
            document.querySelector('.container').innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h1 style="color: var(--primary-green); font-size: 3rem;">✅ Donation Posted!</h1>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">Your generous donation has been saved and is now visible to recipients.</p>
                    <a href="items.html" class="btn btn-primary">Browse All Items</a>
                    <a href="item-detail.html?id=${newItem.id}" class="btn" style="background: #666; color: white; margin-left: 10px;">View Your Item</a>
                    <a href="donate.html" class="btn btn-secondary" style="margin-left: 10px;">Post Another</a>
                </div>
            `;
        }
    </script>
</body>
</html>
