<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HelpEthiopia</title>
    <link rel="icon" type="image/jpeg" href="images/download.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Help<span>Ethiopia</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 85vh;">
        <div class="form-container" style="width: 100%;">
            <h2 style="text-align: center; margin-bottom: 20px;">Join the HelpEthiopia Community</h2>
            <p style="text-align: center; color: #666; margin-bottom: 25px;">Create your account and select your primary role.</p>
            
            <form action="signup-success.html" method="GET">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>I Am Joining As:</label>
                    <select class="form-control" required>
                        <option value="">-- Select Role --</option>
                        <option value="Donor">Donor (I want to give items)</option>
                        <option value="Recipient">Recipient (I am requesting help)</option>
                        <option value="NGO/Admin">NGO / Partner Organization</option>
                    </select>
                </div>
                
                <div class="form-group" style="text-align: center;">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" style="display: inline; font-weight: normal;">I agree to the <a href="terms.html" style="color: var(--primary-green);">Terms and Privacy Policy</a></label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                <p style="text-align: center; margin-top: 15px;">
                    Already have an account? <a href="login.html" style="color: var(--primary-green); font-weight: bold;">Log In</a>
                </p>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate form
            if (!FormValidator.validateForm(this)) {
                Notification.error('Please fill in all required fields correctly');
                return;
            }
            
            const fullName = this.querySelectorAll('input[type="text"]')[0].value;
            const email = this.querySelector('input[type="email"]').value;
            const password = this.querySelector('input[type="password"]').value;
            const role = this.querySelector('select').value;
            
            // Check if user already exists
            const users = StorageManager.getUsers();
            const existingUser = users.find(u => u.email === email);
            
            if (existingUser) {
                Notification.error('An account with this email already exists. Please login instead.');
                return;
            }
            
            if (!role) {
                Notification.error('Please select your role');
                return;
            }
            
            // Create new user
            const newUser = StorageManager.addUser({
                fullName,
                email,
                password, // In production, this should be hashed
                role
            });
            
            // Set as current user
            StorageManager.setCurrentUser({
                id: newUser.id,
                fullName: newUser.fullName,
                email: newUser.email,
                role: newUser.role
            });
            
            // Show success notification
            Notification.success('Account created successfully!');
            
            // Redirect to dashboard after short delay
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        });
    </script>
</body>
</html>
