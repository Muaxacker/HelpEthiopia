<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HelpEthiopia</title>
    <link rel="icon" type="image/jpeg" href="images/download.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Admin<span>Panel</span></div>
            <div class="nav-links">
                <a href="dashboard-admin.html" style="font-weight: bold; color: var(--primary-green);">Overview</a>
                <a href="dashboard-admin.html">Manage Users</a>
                <a href="index.html" class="btn-login" style="background-color: var(--primary-red);">Logout</a>
            </div>
        </nav>
    </header>

    <div class="dashboard-container">
        <h2>Admin Overview - All Pending Items</h2>
        
        <!-- Quick Stats -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: var(--shadow); text-align: center;">
                <h3>Total Donations</h3>
                <p style="font-size: 2rem; color: var(--primary-green);">5</p>
            </div>
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: var(--shadow); text-align: center;">
                <h3>Pending Requests</h3>
                <p style="font-size: 2rem; color: var(--primary-red);">2</p>
            </div>
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: var(--shadow); text-align: center;">
                <h3>Users</h3>
                <p style="font-size: 2rem; color: var(--primary-yellow);">34</p>
            </div>
        </div>

        <h3>Recent Activity (Donations & Requests)</h3>
        <div style="overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Item Name</th>
                        <th>Location</th>
                        <th>Urgency</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dashboardTableBody">
                    <!-- JS will fill this -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script>
        const tableBody = document.getElementById('dashboardTableBody');
        
        // Loop through data.js items and populate table
        itemsData.forEach(item => {
            const row = document.createElement('tr');
            
            // Logic for status color
            let statusColor = 'orange';
            if (item.status === 'Available') statusColor = 'green';
            if (item.status === 'Active') statusColor = 'red';

            const statusSelect = `
                <select onchange="console.log('Status updated for item ' + ${item.id} + ' to ' + this.value)">
                    <option value="Pending" ${item.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="Available" ${item.status === 'Available' ? 'selected' : ''}>Available</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Completed">Completed</option>
                </select>
            `;

            row.innerHTML = `
                <td data-label="Type"><strong>${item.type}</strong></td>
                <td data-label="Item Name">${item.name}</td>
                <td data-label="Location">${item.location}</td>
                <td data-label="Urgency">${item.urgency}</td>
                <td data-label="Status" style="color: ${statusColor}; font-weight: bold;">${item.status}</td>
                <td data-label="Action">
                    ${statusSelect}
                </td>
            `;
            tableBody.appendChild(row);
        });
    </script>
</body>
</html>
